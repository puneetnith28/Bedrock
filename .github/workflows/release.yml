name: Release Automation

on:
  push:
    tags:
      - 'v[0-9]*.[0-9]*.[0-9]*'
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build and test artifacts without publishing draft release)'
        required: true
        type: boolean
        default: true

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  quality-gates:
    name: Pre-Release Quality Gates
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Validate semantic version tag format
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          SEMVER_REGEX='^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?(\+([0-9A-Za-z-]+(\.[0-9A-Za-z-]+)*))?$'
          if [[ ! "$TAG" =~ $SEMVER_REGEX ]]; then
            echo "::error::Tag '$TAG' is not a valid semantic version (expected format: vMAJOR.MINOR.PATCH[-prerelease])."
            exit 1
          fi
          echo "Validated semantic version tag: $TAG"

      - name: Setup Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify brand assertions
        run: npm run check:brand

      - name: Lint verification
        run: npm run lint

      - name: Type check (server & client)
        run: npm run typecheck

      - name: Run automated test suites
        run: npm test

  build-desktop:
    name: Package Desktop (${{ matrix.os }})
    needs: quality-gates
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate application icons
        run: npm run build:icons

      - name: Build web assets and server bundles
        run: npm run build

      - name: Package desktop binaries
        run: npx electron-builder --publish never

      - name: Upload packaged artifacts
        uses: actions/upload-artifact@4cec3d8aa04e39d1a68397de0c4cd6fb9dce8ec1 # v4.6.1
        with:
          name: bedrock-desktop-${{ matrix.os }}
          path: |
            dist-desktop/*.AppImage
            dist-desktop/*.deb
            dist-desktop/*.dmg
            dist-desktop/*.zip
            dist-desktop/*.exe
          if-no-files-found: warn

  publish-release:
    name: Publish Draft GitHub Release
    needs: [quality-gates, build-desktop]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Determine release vs prerelease
        id: release_type
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          if [[ "$TAG" =~ - ]]; then
            echo "is_prerelease=true" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG identified as a pre-release."
          else
            echo "is_prerelease=false" >> "$GITHUB_OUTPUT"
            echo "Tag $TAG identified as a stable release."
          fi

      - name: Download all packaged artifacts
        uses: actions/download-artifact@cc203385981b70ca67e1cc392babf9cc229d5806 # v4.1.9
        with:
          path: release-artifacts

      - name: Prepare release assets and generate checksums
        id: prepare_assets
        run: |
          mkdir -p release-dist
          find release-artifacts -type f \( -name "*.AppImage" -o -name "*.deb" -o -name "*.dmg" -o -name "*.zip" -o -name "*.exe" \) -exec cp {} release-dist/ \;

          cd release-dist
          if [ "$(ls -A .)" ]; then
            find . -maxdepth 1 -type f ! -name "SHA256SUMS.txt" -exec sha256sum {} + | sed 's|^\./||' | sort > SHA256SUMS.txt
            echo "Generated checksums for release files:"
            cat SHA256SUMS.txt
          else
            echo "No desktop binaries found in release-dist"
            touch SHA256SUMS.txt
          fi

      - name: Create Draft GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') && !(inputs.dry_run == true)
        uses: softprops/action-gh-release@c95fe1489396fe8a9eb87c0abf8aa5b2ef267fda # v2.2.1
        with:
          draft: true
          prerelease: ${{ steps.release_type.outputs.is_prerelease == 'true' }}
          generate_release_notes: true
          files: |
            release-dist/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
