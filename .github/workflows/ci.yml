name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  validate:
    name: Quality Gates (Node.js 22)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Setup Node.js 22.x
        uses: actions/setup-node@1d0ff469b7ec7b3cb9d8673fde0c81c44821de2a # v4.2.0
        with:
          node-version: 22.x
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify branding and conventions
        run: npm run check:brand

      - name: Lint checks
        run: npm run lint

      - name: Code formatting verification
        run: npm run format

      - name: Type check (server & client)
        run: npm run typecheck

      - name: Run automated test suites (50 suites)
        run: npm test

      - name: Build production bundles (tsup & vite)
        run: npm run build
