name: Dependency Review

on:
  pull_request:
    paths:
      - 'package.json'
      - 'package-lock.json'
      - '.npmrc'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  dependency-review:
    name: Dependency Vulnerability & License Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Perform Dependency Review
        uses: actions/dependency-review-action@da24556b548a50705dd671f47852072ea4c105d9 # v4.7.1
        with:
          fail-on-severity: high
          deny-licenses:
            - 'GPL-1.0-only'
            - 'GPL-1.0-or-later'
            - 'GPL-2.0-only'
            - 'GPL-2.0-or-later'
            - 'GPL-3.0-only'
            - 'GPL-3.0-or-later'
            - 'AGPL-1.0-only'
            - 'AGPL-1.0-or-later'
            - 'AGPL-3.0-only'
            - 'AGPL-3.0-or-later'
