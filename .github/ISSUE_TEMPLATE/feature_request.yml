name: Feature Request
description: Suggest an idea or enhancement for Bedrock
title: '[Feature]: '
labels: ['enhancement', 'triage']
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping make Bedrock better! Please describe your proposed capability or architectural improvement.

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or limitation? A clear and concise description of what the problem is.
      placeholder: I am always frustrated when...
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution or Feature
      description: Describe what you want to happen and how it should behave.
      placeholder: Provide a clear description of the proposed feature, API, or workflow...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternative Approaches Considered
      description: Describe any alternative solutions, tools, or workarounds you've considered.
      placeholder: Mention alternatives or why this approach is preferred...
    validations:
      required: false

  - type: textarea
    id: benefits
    attributes:
      label: Expected Benefits & Impact
      description: How does this benefit Bedrock users, teams, or open-source contributors?
      placeholder: Explain the expected value proposition or workflow acceleration...
    validations:
      required: true

  - type: checkboxes
    id: checklist
    attributes:
      label: Checklist
      options:
        - label: I have searched existing issues and discussions to confirm this hasn't been proposed yet.
          required: true
        - label: I am willing to contribute code or help test this feature if accepted.
          required: false
